# Only kagent may reach the MCP port. The server checks every token itself,
# but a caller's token is forwarded to each MCP server an agent uses, so keep
# the set of pods that can present one small.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: aula-mcp
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: aula-mcp
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kagent
      ports:
        - port: 7878
