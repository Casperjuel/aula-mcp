apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: aula-mcp
resources:
  - namespace.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - networkpolicy.yaml
configMapGenerator:
  - name: aula-mcp-config
    envs:
      - config.env
images:
  - name: aula-mcp
    newName: registry.example.com/aula-mcp
    newTag: latest
