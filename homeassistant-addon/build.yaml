# HA Supervisor build config for the aula-mcp add-on.
#
# No `build_from` here: the Dockerfile pins its own base (node:22-bookworm-slim
# for the pnpm install, with the Bun runtime copied out of oven/bun:1.3-debian),
# and letting Supervisor swap the base per-arch would defeat that.
#
# To pin the add-on to a specific tag instead of `main`, set AULA_MCP_REF below
# (e.g. `AULA_MCP_REF: "v1.3.0"`).
args:
  AULA_MCP_REF: main
