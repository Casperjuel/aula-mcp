{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "aula-mcp.fullname" . }}
  labels:
    {{- include "aula-mcp.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "aula-mcp.selectorLabels" . | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    # Kubelet probes are not affected by NetworkPolicy on most CNIs.
    - from:
        - podSelector:
            matchLabels:
              {{- include "aula-mcp.clientLabel" . | nindent 14 }}
        {{- if .Values.kagent.enabled }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.kagent.namespace }}
        {{- end }}
        {{- with .Values.networkPolicy.from }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    {{- if .Values.ui.enabled }}
    # The ui server calls the API.
    - from:
        - podSelector:
            matchLabels:
              {{- include "aula-mcp.uiSelectorLabels" . | nindent 14 }}
      ports:
        - port: api
    {{- end }}
{{- if .Values.ui.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "aula-mcp.uiName" . }}
  labels:
    {{- include "aula-mcp.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "aula-mcp.uiSelectorLabels" . | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "aula-mcp.clientLabel" . | nindent 14 }}
        {{- with .Values.networkPolicy.from }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
{{- end }}
{{- end }}
