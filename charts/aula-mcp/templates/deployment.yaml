{{- include "aula-mcp.validate" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aula-mcp.fullname" . }}
  labels:
    {{- include "aula-mcp.labels" . | nindent 4 }}
spec:
  # One replica: sessions and the token store are local to the pod.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "aula-mcp.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "aula-mcp.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: aula-mcp
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: AULA_MCP_HOST
              value: "0.0.0.0"
            - name: AULA_MCP_PORT
              value: "7878"
            {{- if include "aula-mcp.multiParent" . }}
            - name: AULA_MCP_MULTI_PARENT
              value: "1"
            - name: AULA_MCP_OIDC_ISSUER
              value: {{ .Values.oidc.issuer | quote }}
            - name: AULA_MCP_OIDC_AUDIENCE
              value: {{ .Values.oidc.audience | quote }}
            {{- if .Values.oidc.acceptIdToken }}
            - name: AULA_MCP_OIDC_ACCEPT_ID_TOKEN
              value: "1"
            {{- end }}
            {{- else }}
            # Single-parent mode refuses a non-loopback bind without this; the
            # NetworkPolicy limits who can reach it.
            - name: AULA_MCP_ALLOW_REMOTE
              value: "1"
            {{- end }}
            {{- if .Values.setupUi.enabled }}
            - name: AULA_MCP_INGRESS_PORT
              value: {{ .Values.setupUi.port | quote }}
            {{- if include "aula-mcp.multiParent" . }}
            - name: AULA_MCP_SETUP_URL
              value: {{ .Values.setupUi.login.url | quote }}
            - name: AULA_MCP_SETUP_CLIENT_ID
              value: {{ .Values.setupUi.login.clientId | quote }}
            {{- with .Values.setupUi.login.clientSecret }}
            {{- if .existingSecret }}
            - name: AULA_MCP_SETUP_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .existingSecret }}
                  key: {{ .secretKey }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- if .Values.writeTools }}
            - name: AULA_MCP_WRITE
              value: "1"
            {{- end }}
            {{- if .Values.debugLogs }}
            - name: AULA_MCP_LOG
              value: "1"
            {{- end }}
            - name: AULA_MCP_TOOL_NAMES
              value: {{ .Values.toolNames | default (ternary "underscore" "dotted" .Values.kagent.enabled) | quote }}
            - name: AULA_MCP_KEEPALIVE
              value: {{ ternary "1" "0" .Values.tokenKeepAlive | quote }}
            {{- with .Values.encryptionKey.existingSecret }}
            - name: AULA_MCP_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: {{ $.Values.encryptionKey.secretKey }}
            {{- end }}
            {{- if .Values.gallery.persistence.enabled }}
            - name: AULA_MCP_GALLERY_DIR
              value: /gallery
            {{- end }}
            {{- if not .Values.gallery.downloads }}
            - name: AULA_MCP_GALLERY
              value: "0"
            {{- end }}
            - name: AULA_MCP_GALLERY_STOP_AT
              value: {{ .Values.gallery.stopAt | quote }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: mcp
              containerPort: 7878
            {{- if .Values.setupUi.enabled }}
            - name: setup-ui
              containerPort: {{ .Values.setupUi.port }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: mcp
          livenessProbe:
            httpGet:
              path: /healthz
              port: mcp
            periodSeconds: 30
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
            {{- if .Values.gallery.persistence.enabled }}
            - name: gallery
              mountPath: /gallery
            {{- end }}
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim | default (include "aula-mcp.fullname" .) }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: tmp
          emptyDir: {}
        {{- if .Values.gallery.persistence.enabled }}
        - name: gallery
          persistentVolumeClaim:
            claimName: {{ .Values.gallery.persistence.existingClaim | default (printf "%s-gallery" (include "aula-mcp.fullname" .)) }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
