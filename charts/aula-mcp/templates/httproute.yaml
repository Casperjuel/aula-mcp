{{- include "aula-mcp.validate" . }}
{{- range $name, $route := .Values.httpRoute }}
{{- if $route.enabled }}
{{- if not $route.parentRefs }}{{ fail (printf "httpRoute.%s needs parentRefs" $name) }}{{ end }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "aula-mcp.fullname" $ }}-{{ $name | kebabcase }}
  labels:
    {{- include "aula-mcp.labels" $ | nindent 4 }}
  {{- with $route.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- toYaml $route.parentRefs | nindent 4 }}
  {{- with $route.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - backendRefs:
        - name: {{ if eq $name "ui" }}{{ include "aula-mcp.uiName" $ }}{{ else }}{{ include "aula-mcp.fullname" $ }}{{ end }}
          port: {{ index (dict "setupUi" $.Values.setupUi.port "api" $.Values.api.port "ui" $.Values.ui.port) $name | default $.Values.service.port }}
{{- end }}
{{- end }}
