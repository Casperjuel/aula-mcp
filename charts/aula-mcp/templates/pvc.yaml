{{- if and .Values.persistence.enabled (not .Values.persistence.existingClaim) }}
# Aula tokens (per parent under parents/<id>/ in multi-parent mode). Kept on
# uninstall so a reinstall doesn't need every parent to log in again.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "aula-mcp.fullname" . }}
  labels:
    {{- include "aula-mcp.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes:
    {{- toYaml .Values.persistence.accessModes | nindent 4 }}
  {{- with .Values.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
{{- end }}
{{- with .Values.gallery.persistence }}
{{- if and .enabled (not .existingClaim) (not $.Values.gallery.s3.enabled) }}
---
# Downloaded gallery files. Kept on uninstall like the data volume.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "aula-mcp.fullname" $ }}-gallery
  labels:
    {{- include "aula-mcp.labels" $ | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes:
    {{- toYaml .accessModes | nindent 4 }}
  {{- with .storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .size }}
{{- end }}
{{- end }}
