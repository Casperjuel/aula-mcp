apiVersion: v1
kind: Service
metadata:
  name: {{ include "aula-mcp.fullname" . }}
  labels:
    {{- include "aula-mcp.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "aula-mcp.selectorLabels" . | nindent 4 }}
  ports:
    - name: mcp
      port: {{ .Values.service.port }}
      targetPort: mcp
    {{- if .Values.setupUi.enabled }}
    - name: setup-ui
      port: {{ .Values.setupUi.port }}
      targetPort: setup-ui
    {{- end }}
