apiVersion: v1
kind: Pod
metadata:
  name: {{ include "aula-mcp.fullname" . }}-test
  labels:
    {{- include "aula-mcp.labels" . | nindent 4 }}
    {{- include "aula-mcp.clientLabel" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 100
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: check
      image: {{ .Values.tests.image }}
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
      command: ["sh", "-c"]
      args:
        - |
          set -eu
          base=http://{{ include "aula-mcp.fullname" . }}:{{ .Values.service.port }}
          curl -fsS "$base/healthz"
          {{- if include "aula-mcp.multiParent" . }}
          # Multi-parent mode must refuse a call without a token.
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$base/mcp" \
            -H 'content-type: application/json' \
            -H 'accept: application/json, text/event-stream' -d '{}')
          echo "/mcp without a token: $code"
          test "$code" = 401
          {{- if and .Values.kagent.enabled .Values.kagent.remoteMCPServer.discovery }}
          # The tool list answers without a token; a tool call does not.
          rpc() {
            curl -s -o /tmp/out -w '%{http_code}' -X POST "$base/mcp" \
              -H 'content-type: application/json' \
              -H 'accept: application/json, text/event-stream' -d "$1"
          }
          code=$(rpc '{"jsonrpc":"2.0","id":1,"method":"tools/list"}')
          echo "tools/list without a token: $code"
          test "$code" = 200
          grep -q '"tools"' /tmp/out
          code=$(rpc '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"aula_discover","arguments":{}}}')
          echo "tools/call without a token: $code"
          test "$code" = 401
          {{- end }}
          {{- end }}
