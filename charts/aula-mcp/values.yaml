# Build the image from the repository root (see Dockerfile) and push it, or
# load it into kind with `kind load docker-image`.
image:
  repository: aula-mcp
  # Defaults to the chart's appVersion.
  tag: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

# single-parent: one Aula login, and anyone who reaches /mcp acts as that
#   parent. Keep it inside the cluster (networkPolicy) and never expose it
#   publicly.
# multi-parent: every request needs a token from oidc.issuer, and each parent
#   gets their own Aula login (see README, "Log each parent into Aula").
mode: single-parent

oidc:
  # e.g. https://keycloak.example.com/realms/kagent
  issuer: ""
  # Tokens must list this in `aud`.
  audience: aula-mcp
  # Accept Keycloak ID tokens as well as access tokens. kagent's oauth2-proxy
  # forwards ID tokens, so turn this on with kagent.
  acceptIdToken: false

# AULA_MCP_WRITE=1: enable write tools. The server is read-only without it.
writeTools: false
# AULA_MCP_LOG=1: verbose logs.
debugLogs: false
# AULA_MCP_TOOL_NAMES: `dotted` (aula.discover) or `underscore`
# (aula_discover). The Anthropic API refuses tool names with dots, and kagent
# passes MCP tool names straight through. Empty: `underscore` when
# kagent.enabled, else `dotted`.
toolNames: ""

# Renew each parent's Aula access token in the background before it expires
# (AULA_MCP_KEEPALIVE), so a parent stays logged in between chats. With
# false, tokens are only renewed when a tool is called, and a login that sits
# unused past the refresh token's lifetime has to be redone.
tokenKeepAlive: true

# Optional key for the token store (AULA_MCP_KEY, hex or passphrase). Without
# it, each token file is encrypted with a random key stored beside it.
encryptionKey:
  existingSecret: ""
  secretKey: AULA_MCP_KEY

# Local database of each parent's Aula data, filled by the sync jobs and read
# by the dashboard and the aula.local.* tools (see README, AULA_MCP_STORAGE).
storage:
  # sqlite (a file on the data volume), postgres, or none (turned off).
  type: sqlite
  postgres:
    # Secret holding the connection URL. For CloudNativePG this is the
    # <cluster>-app secret, whose `uri` key has the URL.
    existingSecret: ""
    urlKey: uri
  # Key the stored data is encrypted with (base64, 32 bytes:
  # `openssl rand -base64 32`). Without it, one is generated on the data
  # volume; with postgres, keep it in a secret so the database stays readable
  # if the volume is lost.
  key:
    existingSecret: ""
    secretKey: AULA_MCP_STORAGE_KEY

# Background sync of each parent's own Aula data into storage. false: only
# aula.sync.run fetches.
sync:
  enabled: true

extraEnv: []

persistence:
  enabled: true
  # Use an existing PVC instead of creating one.
  existingClaim: ""
  storageClass: ""
  size: 1Gi
  accessModes: ["ReadWriteOnce"]

# Photos and videos from the parents' Aula albums, downloaded by the gallery
# sync job in original quality with a thumbnail (see README, AULA_MCP_GALLERY_*).
gallery:
  # false: albums are still listed, no files are downloaded.
  downloads: true
  # Disk use (0-1) of the gallery volume at which downloads pause.
  stopAt: 0.9
  # Its own volume, mounted at /gallery. Disabled: files go to /data/gallery.
  persistence:
    enabled: true
    existingClaim: ""
    storageClass: ""
    size: 50Gi
    accessModes: ["ReadWriteOnce"]
  # Store the files in an S3 bucket instead of the volume (no volume is made).
  # The layout is the same under <prefix><parent>/. S3 has no disk limit, so
  # stopAt does not apply.
  s3:
    enabled: false
    bucket: ""
    # e.g. http://s3.example.lan for MinIO, Ceph RGW, Garage or SeaweedFS
    # (path-style). Empty: AWS.
    endpoint: ""
    region: us-east-1
    # Must end with "/" when set, e.g. "aula-mcp/".
    prefix: ""
    # Secret with the access keys.
    existingSecret: ""
    accessKeyIdKey: AWS_ACCESS_KEY_ID
    secretAccessKeyKey: AWS_SECRET_ACCESS_KEY

service:
  type: ClusterIP
  port: 7878

# Browser login UI from the Home Assistant add-on.
# single-parent: it has no login of its own; whoever reaches it can log their
#   MitID in as *the* parent of this server.
# multi-parent: each parent first signs in with oidc.issuer (setupUi.login)
#   and logs in to Aula for themselves only.
setupUi:
  enabled: false
  port: 8099
  # single-parent only: must be true to enable setupUi; acknowledges the above.
  iUnderstandItHasNoAuth: false
  # multi-parent only, and required there.
  login:
    # Origin browsers open the UI on, e.g. https://aula-setup.example.com.
    # The IdP client's redirect URI is <url>/auth/callback.
    url: ""
    clientId: aula-mcp-setup
    # Secret holding the client secret of a confidential client. Leave empty
    # for a public client (PKCE only).
    clientSecret:
      existingSecret: ""
      secretKey: client-secret

# Gateway API routes. Each needs at least one parentRef.
httpRoute:
  mcp:
    enabled: false
    annotations: {}
    parentRefs: []
    #  - name: gateway
    #    namespace: gateway
    #    sectionName: https
    hostnames: []
  setupUi:
    enabled: false
    annotations: {}
    parentRefs: []
    hostnames: []

# Only listed peers (and kagent, when enabled) may reach the pod. Add your
# Gateway's namespace here when you use httpRoute.
networkPolicy:
  enabled: true
  from: []
  #  - namespaceSelector:
  #      matchLabels:
  #        kubernetes.io/metadata.name: gateway
# kagent integration (needs the kagent CRDs, api.kagent.dev/v1alpha3).
kagent:
  enabled: false
  namespace: kagent
  remoteMCPServer:
    name: aula-mcp
    description: Aula (Danish school platform) for the signed-in parent only
    timeout: 60s
  agent:
    enabled: false
    name: aula-assistant
    harness: kagent-default
    modelConfig: default-model-config
    description: Answers questions about the signed-in parent's Aula messages, posts and calendar.
    systemPrompt: |
      You help a parent with Aula, the Danish school platform. You only see
      the Aula data of the parent who is signed in. Answer in the language
      the parent writes in. Never send a message unless the parent has seen
      the exact text and asked you to send it. If Aula says the parent is
      not logged in, reply only with the login link it gives and stop; do
      not call other tools.

# One replica only: MCP sessions and the token store live in the pod.
podAnnotations: {}
podLabels: {}
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 512Mi
nodeSelector: {}
tolerations: []
affinity: {}

tests:
  image: curlimages/curl:8.17.0
