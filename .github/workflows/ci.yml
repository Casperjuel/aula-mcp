name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # pnpm version is read from package.json's "packageManager" field
      # (pnpm@10.12.1). Don't set `version` here — the action errors with
      # ERR_PNPM_BAD_PM_VERSION when both are specified.
      - uses: pnpm/action-setup@v6.1.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Bun's install cache (separate from pnpm's) — keyed on the pnpm
      # lockfile so it invalidates whenever dependencies change.
      - name: Cache Bun install
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: bun test

      - name: Coverage report
        run: bun test --coverage 2>&1 | tee coverage.txt
        # Bun prints a per-file table + total. Output goes to job logs and
        # is uploaded as an artifact for PR review without needing Codecov
        # / Coveralls credentials. Graduate to those services if/when the
        # coverage delta becomes worth automating.

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ github.sha }}
          path: coverage.txt
          if-no-files-found: warn
          retention-days: 14

  # Lint the Helm chart and render it with every values file in charts/*/ci.
  chart-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: azure/setup-helm@v5.1.0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - uses: helm/chart-testing-action@v2.9.0

      - name: helm lint
        run: helm lint charts/aula-mcp

      - name: Render every ci values file
        run: |
          for values in charts/aula-mcp/ci/*-values.yaml; do
            echo "--- $values"
            helm template aula-mcp charts/aula-mcp -f "$values" > /dev/null
          done

      - name: ct lint
        run: ct lint --config ct.yaml --all

  # Install the chart into kind in both modes and run its helm tests
  # (scripts/kind-test.sh): health, 401 without a token, tool listing for
  # kagent, and the NetworkPolicy.
  chart-test:
    runs-on: ubuntu-latest
    needs: chart-lint
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v5.1.0

      - uses: helm/kind-action@v1.15.2
        with:
          install_only: true

      - name: kind test
        run: scripts/kind-test.sh
